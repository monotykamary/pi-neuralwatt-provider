name: Update models

on:
  schedule:
    - cron: "7 0 * * *" # 07:07 Asia/Ho_Chi_Minh
  workflow_dispatch:

# Publishing uses npm Trusted Publishing (OIDC) bound to this workflow file, so
# no npm token is stored. A version pushed while publishing was unavailable is
# published by the next run that finds it missing from npm.
permissions:
  contents: write
  id-token: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch the model catalog
        env:
          NEURALWATT_API_KEY: ${{ secrets.NEURALWATT_API_KEY }}
        run: node scripts/update-models.js

      - name: Commit, bump and push
        run: |
          if git diff --quiet; then
            echo "No model changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: update neuralwatt models from API"
          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          git commit -am "chore(release): v$version"
          git push origin HEAD:main

      - name: Publish to npm if this version is missing
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm."
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1 or newer.
          npm install --global npm@latest
          npm publish --access public --provenance
