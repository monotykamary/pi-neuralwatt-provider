name: Update models

on:
  schedule:
    - cron: "7 0 * * *" # 07:07 Asia/Ho_Chi_Minh
  workflow_dispatch:

# This workflow only syncs the catalog and bumps the version; publish.yml does
# the releasing. It publishes any version npm does not have yet, so a release
# that failed earlier goes out with the next hand-off.
permissions:
  contents: write
  actions: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch the model catalog
        env:
          NEURALWATT_API_KEY: ${{ secrets.NEURALWATT_API_KEY }}
        run: node scripts/update-models.js

      - name: Commit, bump and push
        run: |
          if git diff --quiet; then
            echo "No model changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: update neuralwatt models from API"
          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          git commit -am "chore(release): v$version"
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN do not start other workflows, so hand the
      # release to publish.yml explicitly.
      - name: Hand off to publish.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
